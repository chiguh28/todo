<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>TaskFlow - Todo管理 + ガントチャート</title>
<script src="https://unpkg.com/react@18/umd/react.production.min.js" crossorigin></script>
<script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js" crossorigin></script>
<script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@300;400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
<link href="https://cdn.quilljs.com/1.3.7/quill.snow.css" rel="stylesheet">
<script src="https://cdn.quilljs.com/1.3.7/quill.js"></script>
<script src="https://cdn.jsdelivr.net/npm/dompurify@3.1.5/dist/purify.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
{% for ext in extensions %}{% for css in ext.get_static_files().get('css', []) %}
<link rel="stylesheet" href="/extensions/{{ ext.name }}/static/{{ css }}">
{% endfor %}{% endfor %}
</head>
<body>
<div id="root"></div>
<!-- コア: TaskFlowレジストリ + 全コアコンポーネントを定義 (renderはしない) -->
<script type="text/babel" src="{{ url_for('static', filename='app.jsx') }}"></script>
<!-- 拡張JSX: 各拡張が TaskFlow.registerExtension() を呼ぶ -->
{% for ext in extensions %}{% for jsx in ext.get_static_files().get('jsx', []) %}
<script type="text/babel" src="/extensions/{{ ext.name }}/static/{{ jsx }}"></script>
{% endfor %}{% endfor %}
<!-- ブート: 全拡張ロード後にReactをマウント -->
<script type="text/babel">TaskFlow._boot();</script>
</body>
</html>
